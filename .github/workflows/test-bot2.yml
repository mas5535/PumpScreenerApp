name: Test Bot 2 Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Telegram Token
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_ALL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_ALL }}
        run: |
          echo "=== Token length: ${#TELEGRAM_TOKEN} ==="
          echo "=== Chat ID length: ${#TELEGRAM_CHAT_ID} ==="
          echo "=== Token first 4 chars: ${TELEGRAM_TOKEN:0:4} ==="
          echo "=== Token last 4 chars: ${TELEGRAM_TOKEN: -4} ==="
          echo "=== Testing getMe ==="
          RESPONSE=$(curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe")
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK:', d['result']['username']) if d.get('ok') else print('FAIL:', d.get('description'))"
          echo "=== Testing sendMessage ==="
          SEND=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=Test from GitHub Actions")
          echo "$SEND" | python3 -c "import sys,json; d=json.load(sys.stdin); print('SEND OK') if d.get('ok') else print('SEND FAIL:', d.get('description'))"
