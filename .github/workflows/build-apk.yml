name: Run Pump Screener

on:
  schedule:
    # هر یک ساعت (دقیقه ۰)
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install requests
        run: pip install requests
      - name: Check syntax
        run: |
          echo "=== Checking service.py ==="
          python -m py_compile service.py && echo "OK" || echo "SYNTAX ERROR"
          echo "=== Functions ==="
          grep -n "def send_daily_top5" service.py || echo "send_daily_top5 MISSING"
          grep -n "def load_state" service.py || echo "load_state MISSING"
          grep -n "def save_state" service.py || echo "save_state MISSING"
          grep -n "daily_sent" service.py || echo "daily_sent MISSING"
      - name: Run Screener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python service.py

      - name: Commit alerted.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f alerted.json ]; then
            git add alerted.json
            git diff --quiet && git diff --staged --quiet || git commit -m "Update alerted tokens [skip ci]"
            git push
          fi
